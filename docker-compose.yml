services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-binutech}
      POSTGRES_USER: ${POSTGRES_USER:-binutech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://binutech:change-me@db:5432/binutech?sslmode=disable}
      API_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
    depends_on:
      - db
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:

